# lastcall with the published images. Everything happens through Docker; nothing to install on the host.
#
#   docker compose up -d                                     # the sandbox, and lastcall with its web UI on :8080
#   docker compose logs lastcall                             # the web UI's setup code, the first time
#   ACCOUNT=<id> ENGINE=<engine> docker compose run --rm login   # an account's own login, such as claude-code
#   docker compose run --rm cli <command>                    # the command line: status, audit, pause...
#   docker compose --profile local up -d ollama              # a local model server, for accounts on local models
#   docker compose --profile local run --rm ollama-pull <model>  # download a model into it, such as qwen3-coder
#
# The images are those of this file's release, so that the file and the images always match. LASTCALL_VERSION picks
# others: `edge` follows main. Development builds every image from the checkout: add `-f compose.yaml -f compose.dev.yaml`.
name: lastcall

x-lastcall: &lastcall
  image: ghcr.io/ne0x86/lastcall-service:${LASTCALL_VERSION:-0.6.0}
  init: true  # stops at once on `docker compose stop`
  networks: [outside]  # lastcall itself talks to GitHub; agents never do
  environment:
    LASTCALL_SOCKET: /run/lastcall/supervisor.sock
    LASTCALL_DATA_ROOT: /data
    LASTCALL_SECRETS: /secrets
    LASTCALL_STATE: /state
  volumes:
    - data:/data
    - run:/run/lastcall
    - secrets:/secrets
    - state:/state
  depends_on:
    supervisor:
      condition: service_healthy

x-login: &login  # the CLI's own interactive login, with the isolation of a step
  image: ghcr.io/ne0x86/lastcall-runner:${LASTCALL_VERSION:-0.6.0}
  profiles: [login]
  networks: [sandbox]
  user: "1000:1000"
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  depends_on:
    egress:
      condition: service_healthy

services:
  egress:
    image: ghcr.io/ne0x86/lastcall-egress:${LASTCALL_VERSION:-0.6.0}
    networks: [sandbox, outside]
    volumes:
      - ./egress/filter:/etc/tinyproxy/filter:ro
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "8888"]
      interval: 5s
      retries: 12
    restart: unless-stopped

  supervisor:
    image: ghcr.io/ne0x86/lastcall-supervisor:${LASTCALL_VERSION:-0.6.0}
    network_mode: none  # it talks to Docker through the socket and to lastcall through a Unix socket
    environment:
      LASTCALL_CLIENT_GID: "1000"
      LASTCALL_RUNNER_IMAGE: ghcr.io/ne0x86/lastcall-runner:${LASTCALL_VERSION:-0.6.0}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - data:/data
      - run:/run/lastcall
    healthcheck:
      test: ["CMD", "test", "-S", "/run/lastcall/supervisor.sock"]
      interval: 5s
      retries: 12
    depends_on:
      egress:
        condition: service_healthy
    restart: unless-stopped

  cli:  # lastcall's command line: docker compose run --rm cli <command>
    <<: *lastcall
    profiles: [cli]

  lastcall:  # the service and its web UI. It spends nothing until you add accounts and projects in the web UI
    <<: *lastcall
    command: ["serve"]
    ports:  # the web UI, on this machine only; to reach it from elsewhere, put a reverse proxy with HTTPS in front
      - "127.0.0.1:${LASTCALL_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')"]
      interval: 30s
      retries: 3
    restart: unless-stopped

  ollama:  # local models for opencode accounts: steps reach it on the sandbox network, and it has no way out
    image: ollama/ollama:0.40.3
    profiles: [local]
    networks: [sandbox]
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped
    # With an NVIDIA card and its container toolkit, give it the card in a compose.override.yaml:
    #   services: {ollama: {gpus: all}}

  ollama-pull:  # docker compose --profile local run --rm ollama-pull <model>: the only way models come in
    image: ollama/ollama:0.40.3
    profiles: [local]
    networks: [outside]
    volumes:
      - ollama:/root/.ollama
    entrypoint:
      - sh
      - -c
      - 'ollama serve >/dev/null 2>&1 & until ollama list >/dev/null 2>&1; do sleep 1; done; exec ollama pull "$$@"'
      - ollama-pull

  login:  # ACCOUNT=<id> ENGINE=<engine> docker compose run --rm login
    <<: *login
    environment:
      HTTPS_PROXY: http://egress:8888
      HTTP_PROXY: http://egress:8888
      NO_PROXY: localhost,127.0.0.1
      LASTCALL_ENGINE: ${ENGINE:-}
    volumes:
      - account:/home/runner/.account
      - ./runner/login.sh:/home/runner/login.sh:ro  # each engine's own login command
    command: ["sh", "/home/runner/login.sh"]

networks:
  sandbox:
    name: lastcall-sandbox
    internal: true
  outside: {}

volumes:
  data:
    name: lastcall-data
  run:
    name: lastcall-run
  secrets:
    name: lastcall-secrets
  state:
    name: lastcall-state
  ollama:  # the local models
    name: lastcall-ollama
  account:  # one volume per account; the label stops one id from mixing two engines
    name: lastcall-account-${ACCOUNT:-unset}
    labels:
      lastcall.engine: ${ENGINE:-unset}

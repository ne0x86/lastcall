# The sandbox: egress proxy, supervisor and the runner image. The lastcall service joins later.
#
#   docker compose --profile build build                    # build all images, the runner included
#   docker compose up -d                                    # egress proxy and supervisor
#   uv run lastcall login <account> --engine claude-code    # on the host: the CLI's own login
#   docker compose run --rm cli quota <account> --engine claude-code
#   docker compose --profile test run --rm it               # sandbox integration tests
name: lastcall

services:
  egress:
    build: egress
    image: lastcall-egress:dev
    networks: [sandbox, outside]
    volumes:
      - ./egress/filter:/etc/tinyproxy/filter:ro
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "8888"]
      interval: 5s
      retries: 12
    restart: unless-stopped

  supervisor:
    build:
      context: .
      target: supervisor
    image: lastcall-supervisor:dev
    network_mode: none  # it talks to Docker through the socket and to the service through a Unix socket
    environment:
      LASTCALL_CLIENT_GID: "1000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - data:/data
      - run:/run/lastcall
    healthcheck:
      test: ["CMD", "test", "-S", "/run/lastcall/supervisor.sock"]
      interval: 5s
      retries: 12
    depends_on:
      egress:
        condition: service_healthy
    restart: unless-stopped

  runner:  # only built: the supervisor starts one container per step from this image
    build: runner
    image: lastcall-runner:dev
    profiles: [build]

  cli:  # lastcall's command line where the supervisor socket is: docker compose run --rm cli ...
    build:
      context: .
      target: service
    image: lastcall-service:dev
    profiles: [cli]
    network_mode: none
    environment:
      LASTCALL_SOCKET: /run/lastcall/supervisor.sock
      LASTCALL_DATA_ROOT: /data
    volumes:
      - data:/data
      - run:/run/lastcall
    depends_on:
      supervisor:
        condition: service_healthy

  it:
    build:
      context: .
      target: test
    image: lastcall-it:dev
    profiles: [test]
    network_mode: none
    environment:
      LASTCALL_SOCKET: /run/lastcall/supervisor.sock
      LASTCALL_DATA_ROOT: /data
    volumes:
      - data:/data
      - run:/run/lastcall
    command: ["python", "-m", "pytest", "-p", "no:cacheprovider", "-m", "integration", "tests/integration"]
    depends_on:
      supervisor:
        condition: service_healthy

networks:
  sandbox:
    name: lastcall-sandbox
    internal: true
  outside: {}

volumes:
  data:
    name: lastcall-data
  run:
    name: lastcall-run

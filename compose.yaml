# lastcall with the published images. Everything happens through Docker; nothing to install on the host.
#
#   docker compose up -d                                                    # egress proxy and supervisor
#   docker compose run --rm -p 127.0.0.1:8765:8765 cli github setup --owner <login>
#   ACCOUNT=<id> docker compose run --rm login-claude-code                  # or login-codex
#   docker compose run --rm cli account add <id> --engine claude-code
#   docker compose run --rm cli project add <owner/name>
#   docker compose run --rm cli audit <owner/name> --account <id> --report-only
#   docker compose --profile service up -d                                  # the service: bursts on its own
#
# Development builds every image from the checkout: add `-f compose.yaml -f compose.dev.yaml`.
name: lastcall

x-lastcall: &lastcall
  image: ghcr.io/ne0x86/lastcall-service:${LASTCALL_VERSION:-latest}
  networks: [outside]  # lastcall itself talks to GitHub; agents never do
  environment:
    LASTCALL_SOCKET: /run/lastcall/supervisor.sock
    LASTCALL_DATA_ROOT: /data
    LASTCALL_SECRETS: /secrets
    LASTCALL_STATE: /state
  volumes:
    - data:/data
    - run:/run/lastcall
    - secrets:/secrets
    - state:/state
  depends_on:
    supervisor:
      condition: service_healthy

x-login: &login  # the CLI's own interactive login, with the isolation of a step
  image: ghcr.io/ne0x86/lastcall-runner:${LASTCALL_VERSION:-latest}
  profiles: [login]
  networks: [sandbox]
  user: "1000:1000"
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  depends_on:
    egress:
      condition: service_healthy

services:
  egress:
    image: ghcr.io/ne0x86/lastcall-egress:${LASTCALL_VERSION:-latest}
    networks: [sandbox, outside]
    volumes:
      - ./egress/filter:/etc/tinyproxy/filter:ro
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "8888"]
      interval: 5s
      retries: 12
    restart: unless-stopped

  supervisor:
    image: ghcr.io/ne0x86/lastcall-supervisor:${LASTCALL_VERSION:-latest}
    network_mode: none  # it talks to Docker through the socket and to lastcall through a Unix socket
    environment:
      LASTCALL_CLIENT_GID: "1000"
      LASTCALL_RUNNER_IMAGE: ghcr.io/ne0x86/lastcall-runner:${LASTCALL_VERSION:-latest}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - data:/data
      - run:/run/lastcall
    healthcheck:
      test: ["CMD", "test", "-S", "/run/lastcall/supervisor.sock"]
      interval: 5s
      retries: 12
    depends_on:
      egress:
        condition: service_healthy
    restart: unless-stopped

  cli:  # lastcall's command line: docker compose run --rm cli <command>
    <<: *lastcall
    profiles: [cli]

  lastcall:  # the service. Opt-in: `docker compose --profile service up -d` lets it spend unused quota
    <<: *lastcall
    profiles: [service]
    command: ["serve"]
    restart: unless-stopped

  login-claude-code:  # ACCOUNT=<id> docker compose run --rm login-claude-code
    <<: *login
    environment:
      HTTPS_PROXY: http://egress:8888
      HTTP_PROXY: http://egress:8888
      NO_PROXY: localhost,127.0.0.1
      CLAUDE_CONFIG_DIR: /home/runner/.claude
    volumes:
      - account-claude-code:/home/runner/.claude
    command: ["claude", "auth", "login"]

  login-codex:  # ACCOUNT=<id> docker compose run --rm login-codex
    <<: *login
    environment:
      HTTPS_PROXY: http://egress:8888
      HTTP_PROXY: http://egress:8888
      NO_PROXY: localhost,127.0.0.1
      CODEX_HOME: /home/runner/.codex
    volumes:
      - account-codex:/home/runner/.codex
    command: ["codex", "login", "--device-auth"]

networks:
  sandbox:
    name: lastcall-sandbox
    internal: true
  outside: {}

volumes:
  data:
    name: lastcall-data
  run:
    name: lastcall-run
  secrets:
    name: lastcall-secrets
  state:
    name: lastcall-state
  account-claude-code:  # one volume per account; the label stops one id from mixing two engines
    name: lastcall-account-${ACCOUNT:-unset}
    labels:
      lastcall.engine: claude-code
  account-codex:
    name: lastcall-account-${ACCOUNT:-unset}
    labels:
      lastcall.engine: codex

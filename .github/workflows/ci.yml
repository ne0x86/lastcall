name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy
      - run: uv run pytest

  sandbox:
    name: Sandbox
    runs-on: ubuntu-latest
    env:
      COMPOSE_FILE: compose.yaml:compose.dev.yaml  # build from this checkout, not the published images
    steps:
      - uses: actions/checkout@v7
      - run: docker compose --profile build --profile test build
      - run: docker compose --profile test run --rm it
      - if: failure()
        run: docker compose logs egress supervisor

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: docker  # the base images of the service, the runner and the egress proxy
    directories: [/, /runner, /egress]
    schedule:
      interval: monthly

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "lastcall"
dynamic = ["version"]
description = "Spend the AI subscription quota you already pay for on small, verified pull requests before it resets."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Ne0x" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "cryptography>=43",
    "flask>=3.1",
    "waitress>=3.0.2",
]

[project.scripts]
lastcall = "lastcall.cli:main"

[project.urls]
Homepage = "https://github.com/ne0x86/lastcall"
Issues = "https://github.com/ne0x86/lastcall/issues"

[dependency-groups]
dev = ["mypy>=1.13", "pytest>=8.3", "ruff>=0.8", "types-waitress>=3.0.1"]

[tool.hatch.version]
path = "src/lastcall/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/lastcall"]

[tool.ruff]
line-length = 118
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
platform = "linux"  # lastcall runs in Linux containers, whatever the development machine
strict = true
files = ["src", "tests"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["integration: needs the sandbox from compose.yaml (docker compose --profile test run --rm it)"]
